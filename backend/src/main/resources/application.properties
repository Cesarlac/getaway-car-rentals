spring.application.name=aluguel-carros

# Supabase (PostgreSQL) - Session Pooler
spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.vlzwqjvoftxptsmlgnsr
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
app.jwt.secret=${JWT_SECRET}
spring.jpa.open-in-view=false
spring.web.error.include-message=always

# Plano gratuito tem limite de conexões
spring.datasource.hikari.maximum-pool-size=5

# Tabelas já existem no Supabase, então o Hibernate não deve alterá-las
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true